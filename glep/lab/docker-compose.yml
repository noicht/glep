name: glep-lab

services:
  target:
    build:
      context: .
      dockerfile: Dockerfile
    image: glep-lab-target:latest
    container_name: glep-lab-target
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    environment:
      HTTP_PORT: "${HTTP_PORT:-18080}"
      SSH_PORT: "${SSH_PORT:-12222}"
      REDIS_PORT: "${REDIS_PORT:-16379}"
    # Por defecto solo loopback. Para probar desde otra máquina de la LAN:
    #   LAB_BIND=0.0.0.0 lab/run_lab.sh start
    ports:
      - "${LAB_BIND:-127.0.0.1}:${HTTP_PORT:-18080}:${HTTP_PORT:-18080}"
      - "${LAB_BIND:-127.0.0.1}:${SSH_PORT:-12222}:${SSH_PORT:-12222}"
      - "${LAB_BIND:-127.0.0.1}:${REDIS_PORT:-16379}:${REDIS_PORT:-16379}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${HTTP_PORT:-18080}/', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 10
