[project]
name = "glep"
version = "0.2.0"
description = "GBNF LLM Edge Pentester — agente de pentesting silencioso para Raspberry Pi Zero 2W"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.2.90"]
dev = ["pytest>=8.0"]

[project.scripts]
glep = "glep.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
